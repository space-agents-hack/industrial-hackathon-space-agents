name: Bootstrap

# Connects this repository to its own Vercel and Supabase projects from GitHub alone, for a
# machine without the CLIs (with them, the local Setup page does the same from one form). It runs
# scripts/bootstrap.sh with the values below, then starts a release.
#
# First time: in Settings > Environments > production (create the environment with that name if
# it is not there yet) add these secrets:
#   VERCEL_TOKEN           vercel.com/account/tokens
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   GH_CONTROL_TOKEN       a fine-grained token for this repository only (docs/deploy.md lists
#                          the permissions); production uses it to change settings later
#   ADMIN_PASSWORD         the first admin's password (12+ characters); deleted after use
# and run this workflow with your email. It creates the Supabase project unless you give one
# (then add its SUPABASE_DB_PASSWORD too). Safe to repeat; empty inputs keep the last choice.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Existing Supabase project ID. Empty: the one from the last run, or a new project."
        required: false
      supabase_org:
        description: "Supabase organisation slug for a new project. Only needed if the token reaches several."
        required: false
      region:
        description: "Region of a new Supabase project"
        required: false
        default: eu-central-1
      admin_email:
        description: "Email of the first admin; the password is the ADMIN_PASSWORD secret. Empty: create nobody."
        required: false
      agent_model:
        description: "Default model, e.g. scripted or anthropic:claude-opus-5-5. Empty: the last one, or scripted."
        required: false
      vercel_team:
        description: "Vercel team slug. Only needed if the token reaches more than one team."
        required: false
      release:
        description: "Start a release when done"
        type: boolean
        default: true

permissions:
  contents: read
  # To start the Deploy workflow at the end.
  actions: write

# The same queue as the release job: changing the environment of a project half-way through its
# release would deploy a mix of old and new values.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  bootstrap:
    name: Connect Vercel and Supabase
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Inputs reach the scripts through env, never pasted into them: a quote in a field would
      # otherwise run as code.
      - name: What is set
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_CONTROL_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PROJECT_REF: ${{ inputs.project_ref || secrets.SUPABASE_PROJECT_REF }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          missing=()
          for name in VERCEL_TOKEN SUPABASE_ACCESS_TOKEN GH_CONTROL_TOKEN; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing secrets in Settings > Environments > production: ${missing[*]}."
            exit 1
          fi
          if [[ -n "$PROJECT_REF" && ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::A Supabase project ID is 20 lowercase letters and digits (Project Settings > General)."
            exit 1
          fi
          if [[ -n "$ADMIN_EMAIL" && ${#ADMIN_PASSWORD} -lt 12 ]]; then
            echo "::error::To create $ADMIN_EMAIL, add the ADMIN_PASSWORD secret (12 or more characters)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: supabase/setup-cli@v3
        with:
          version: "2.115.0"

      - name: Connect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SHARED_SECRET: ${{ secrets.AGENT_SHARED_SECRET }}
          PROVIDER_KEY: ${{ secrets.PROVIDER_API_KEY }}
          PROJECT_REF: ${{ inputs.project_ref || secrets.SUPABASE_PROJECT_REF }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          AGENT_MODEL: ${{ inputs.agent_model || vars.AGENT_MODEL || 'scripted' }}
          VERCEL_TEAM: ${{ inputs.vercel_team }}
          SUPABASE_ORG: ${{ inputs.supabase_org }}
          REGION: ${{ inputs.region }}
        # The answers go to the script on standard input, as the Setup page used to send them.
        run: |
          python3 - <<'PY' | bash scripts/bootstrap.sh --from-json
          import json, os
          e = lambda name: os.environ.get(name, "")
          users = [{"email": e("ADMIN_EMAIL"), "password": e("ADMIN_PASSWORD")}] if e("ADMIN_EMAIL") else []
          print(json.dumps({
              "vercel_token": e("VERCEL_TOKEN"),
              "vercel_team": e("VERCEL_TEAM"),
              "project_ref": e("PROJECT_REF"),
              "supabase_org": e("SUPABASE_ORG"),
              "region": e("REGION"),
              "db_password": e("DB_PASSWORD"),
              "supabase_token": e("SUPABASE_ACCESS_TOKEN"),
              "agent_model": e("AGENT_MODEL"),
              "provider_key": e("PROVIDER_KEY"),
              "shared_secret": e("SHARED_SECRET"),
              "github_token": e("GH_TOKEN"),
              "users": users,
          }))
          PY

      # A password in a secret store is still a password lying around. The person changes it
      # after signing in; this removes the copy.
      - name: Forget the admin password
        if: inputs.admin_email != ''
        env:
          GH_TOKEN: ${{ secrets.GH_CONTROL_TOKEN }}
        run: gh secret delete ADMIN_PASSWORD --env production --repo "$GITHUB_REPOSITORY" || true

      - name: Start a release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Release started: follow it in Admin > Releases or the Actions tab." >> "$GITHUB_STEP_SUMMARY"
