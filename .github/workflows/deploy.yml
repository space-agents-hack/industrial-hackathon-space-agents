name: Deploy

# One workflow, two halves:
#   checks   on every push and pull request: Python, web and database, in parallel.
#   release  on a push to main, only if every check is green: migrations, then the agent, then the
#            web. Each side is deployed WITHOUT the production domain, smoke-tested, and only then
#            promoted. A broken build never becomes what people see.
#
# Several people push to main. What keeps that safe is in the release job: one release at a time,
# and a release for a commit that is no longer the head of main is skipped.
#
# A clone with no secrets yet stays green: the release job says what is missing and stops.
# docs/deploy.md lists the secrets; scripts/bootstrap.sh sets them.

on:
  push:
    branches: [main]
    # Markdown and docs/ start nothing, except under agent/: the agent reads
    # agent_service/domain/prompt.md at run time, so a prompt change is a code change. A later
    # positive pattern re-includes what an earlier `!` excluded.
    paths: ['**', '!**.md', '!docs/**', 'agent/**']
  pull_request:
  # To release again without a new commit, for example after setting a missing variable.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned on purpose. A new CLI can change how a build is packaged without anything changing in
  # this repo. Raise these deliberately, in a commit of their own.
  VERCEL_CLI_VERSION: "63.1.2"
  SUPABASE_CLI_VERSION: "2.115.0"
  UV_VERSION: "0.13.0"
  NODE_VERSION: "24"

jobs:
  repo:
    name: Check scripts, workflows and migrations
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    concurrency:
      group: ${{ github.workflow }}-repo-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration rule compares with the previous main, so it needs history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Shell scripts
        run: uvx --from shellcheck-py shellcheck -x scripts/*.sh

      - name: Workflows
        run: uvx --from actionlint-py actionlint

      # Before the release, not at it: `supabase db push` would refuse an out-of-order migration
      # only after the checks had passed, and main would stay red until someone renamed it.
      - name: Migrations are only added, and in order
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]]; then
            base="origin/$BASE_REF"
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE"
          else
            echo "Nothing to compare with."; exit 0
          fi
          scripts/check-migrations.sh "$base"

  agent:
    name: Check agent (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    concurrency:
      group: ${{ github.workflow }}-agent-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      # --locked: fail if uv.lock does not match pyproject.toml, instead of quietly resolving
      # different versions from the ones that were tested.
      - name: Install
        run: uv sync --locked --all-groups

      # Fastest first: a lint error is easier to read than the test failure it causes.
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      # The scripted model, so this is free and offline. It proves the eval harness still runs;
      # evaluating a real model is a manual step (`make eval`).
      - name: Evals (scripted model)
        run: uv run python -m evals.ecn_triage

  web:
    name: Check web (Next.js)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    concurrency:
      group: ${{ github.workflow }}-web-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Placeholder values: the build needs the variables to exist, not to work.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  database:
    name: Check database (migrations, RLS, contract)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-database-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Starting from nothing applies every migration in order, which is the test that a fresh
      # project can be built from this repo. Services the checks do not use are left out because
      # pulling their images is most of the start-up time. Storage stays: the regulations
      # migration creates a bucket and the integration tests write to it.
      - name: Start Supabase
        run: supabase start -x edge-runtime,logflare,vector,imgproxy,supavisor,studio,mailpit

      - name: RLS tests (pgTAP)
        run: supabase test db --local

      - name: Lint SQL
        run: supabase db lint --local --schema public --level warning --fail-on error

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      # The agent's storage code against the real schema, through the API gateway. This is what
      # fails when a migration and the agent stop agreeing.
      - name: Contract test (agent against this schema)
        working-directory: agent
        run: |
          set -euo pipefail
          eval "$(cd .. && supabase status -o env | grep -E '^(API_URL|SECRET_KEY)=')"
          echo "::add-mask::$SECRET_KEY"
          uv sync --locked --all-groups
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" uv run pytest -q -m integration

  release:
    name: Release to production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [repo, agent, web, database]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    environment: production
    # One release at a time, none cancelled half-way. The queue starts after the checks, so a push
    # whose checks fail never delays a green one.
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      AGENT_PROJECT_ID: ${{ secrets.VERCEL_AGENT_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # The database's connection address without the password (scripts/bootstrap.sh stores it).
      # With it, migrations need only the password, not an account-wide Supabase token.
      SUPABASE_POOLER_URL: ${{ vars.SUPABASE_POOLER_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The head check compares this commit with newer ones on main, so it needs history.
          fetch-depth: 0

      - name: What is configured
        id: config
        shell: bash
        run: |
          missing_vercel=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID WEB_PROJECT_ID AGENT_PROJECT_ID; do
            [[ -n "${!name}" ]] || missing_vercel+=("$name")
          done
          # Migrations need the project and its password, and a way in: the connection address
          # (SUPABASE_POOLER_URL) or an access token to look it up.
          missing_db=()
          for name in SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            [[ -n "${!name}" ]] || missing_db+=("$name")
          done
          if [[ -z "$SUPABASE_POOLER_URL" && -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            missing_db+=("SUPABASE_POOLER_URL or SUPABASE_ACCESS_TOKEN")
          fi
          if (( ${#missing_vercel[@]} == 4 )); then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "database=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Not released: this repository is not connected to Vercel yet"
              echo
              echo "Checks passed. To deploy, run \`scripts/bootstrap.sh\` (see docs/deploy.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Half-configured is a mistake, not a choice: say which names are missing and stop.
          if (( ${#missing_vercel[@]} > 0 )); then
            echo "::error::Vercel is partly configured. Missing: ${missing_vercel[*]} (docs/deploy.md)."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

          if (( ${#missing_db[@]} == 0 )); then
            echo "database=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$SUPABASE_PROJECT_REF$SUPABASE_DB_PASSWORD$SUPABASE_POOLER_URL$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets are not set: migrations are NOT applied by this workflow. Apply them by hand before code that needs them (supabase/README.md)."
          else
            echo "::error::Supabase is partly configured. Missing: ${missing_db[*]} (docs/deploy.md)."
            exit 1
          fi

      # GitHub does not guarantee the order of the queue. If main has moved on, a newer release is
      # coming and this one would only put older code in front of people for a few minutes.
      - name: Is this commit still the head of main
        id: head
        if: steps.config.outputs.deploy == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$current_sha" ]]; then
            echo "::error::Could not resolve origin/main"
            exit 1
          fi
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            git fetch --quiet origin main
            # A push that touches only paths-ignore files (Markdown, docs/) starts no workflow, so
            # skipping for it leaves this release undone with nothing coming after it. That kept
            # production on an old version on 2026-10-24. Release anyway when every newer commit
            # is docs only: the code is the same as at the head. "Docs only" is the push filter
            # above: Markdown under agent/ (the prompt) is code.
            if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$current_sha" \
              || git diff --name-only "$EXPECTED_SHA" "$current_sha" \
                | awk '/^agent\// || !(/\.md$/ || /^docs\//) { code = 1 } END { exit !code }'; then
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "Release skipped: main is now at $current_sha." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main is at $current_sha, newer only in docs: releasing $EXPECTED_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      # Migrations first: new code may need a new column, old code must tolerate it. That is why
      # a migration has to work with the PREVIOUS version of the code (AGENTS.md, "Limits").
      # Applying to the remote cannot be undone from here; the fix for a bad migration is a new
      # migration.
      - uses: supabase/setup-cli@v3
        if: steps.head.outputs.current == 'true' && steps.config.outputs.database == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply migrations
        if: steps.head.outputs.current == 'true' && steps.config.outputs.database == 'true'
        shell: bash
        run: |
          if [[ -n "$SUPABASE_POOLER_URL" ]]; then
            # The address is a repository variable, which more hands can change than the secret
            # password: send the password only to this project's Supabase pooler.
            if [[ ! "$SUPABASE_POOLER_URL" =~ ^postgresql://postgres\.${SUPABASE_PROJECT_REF}@[a-z0-9.-]+\.pooler\.supabase\.com:[0-9]+/[a-z_]+$ ]]; then
              echo "::error::SUPABASE_POOLER_URL is not this project's Supabase pooler. Not migrating."
              exit 1
            fi
            # The password goes into the address here, URL-encoded, and only into this process.
            db_url="$(python3 -c 'import os, urllib.parse as u; a = os.environ["SUPABASE_POOLER_URL"]; print(a.replace("@", ":" + u.quote(os.environ["SUPABASE_DB_PASSWORD"], safe="") + "@", 1))')"
            echo "::add-mask::$db_url"
            supabase db push --db-url "$db_url"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_REF"
            supabase db push
          fi

      # Certivity's reference files (regulations/index.json, every expected.json and
      # requirements_old.json) are licensed for the event only, so they live in the table
      # certivity_reference, not in git (AGENTS.md, "Limits"). Every release reloads them from
      # Certivity's package, so production's checks have them, and Sunday's held-out case is in
      # after `git pull` upstream plus one release (Actions > Deploy > Run workflow is enough).
      # Through psql because GitHub holds the database password, not the API's secret key.
      # A failure warns and does not stop the release: the code does not depend on this data, and
      # the checks say "not loaded" rather than give a wrong answer.
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.head.outputs.current == 'true' && steps.config.outputs.database == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      - name: Load Certivity's reference files
        if: steps.head.outputs.current == 'true' && steps.config.outputs.database == 'true'
        continue-on-error: true
        shell: bash
        env:
          CERTIVITY_REPO: ${{ vars.CERTIVITY_REPO || 'https://github.com/Certivity/industrial-ai-hackathon' }}
        run: |
          if [[ -z "$SUPABASE_POOLER_URL" ]]; then
            echo "::warning::SUPABASE_POOLER_URL is not set: Certivity's reference files were not loaded. Run make certivity-load against the hosted project."
            exit 0
          fi
          if [[ ! "$SUPABASE_POOLER_URL" =~ ^postgresql://postgres\.${SUPABASE_PROJECT_REF}@[a-z0-9.-]+\.pooler\.supabase\.com:[0-9]+/[a-z_]+$ ]]; then
            echo "::warning::SUPABASE_POOLER_URL is not this project's Supabase pooler. Certivity's reference files were not loaded."
            exit 0
          fi
          # Outside the checkout and deleted at the end: on a self-hosted runner the workspace
          # stays, and the data must not outlive the event on a machine nobody purges.
          pkg="$RUNNER_TEMP/certivity" rows="$RUNNER_TEMP/certivity-rows.json"
          trap 'rm -rf "$pkg" "$rows"' EXIT
          git clone --quiet --depth 1 "$CERTIVITY_REPO" "$pkg"
          (cd agent && uv run --quiet python -m agent_service.domain.load_certivity --json "$pkg") > "$rows"
          db_url="$(python3 -c 'import os, urllib.parse as u; a = os.environ["SUPABASE_POOLER_URL"]; print(a.replace("@", ":" + u.quote(os.environ["SUPABASE_DB_PASSWORD"], safe="") + "@", 1))')"
          echo "::add-mask::$db_url"
          psql "$db_url" -v ON_ERROR_STOP=1 -q -v rows_file="$rows" -f scripts/load-certivity.sql
          echo "Certivity's reference files loaded from $CERTIVITY_REPO at $(git -C "$pkg" rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"

      # Vercel can refuse a deployment whose commit author is not a member of the team that owns
      # the project. The amend exists only on this runner: it is never pushed and does not change
      # the commit on GitHub. Set the two repository variables to the Vercel owner's identity.
      # Through env, not pasted into the script: a quote or $(...) in a name would otherwise run.
      - name: Re-author the commit as the Vercel owner
        if: steps.head.outputs.current == 'true' && vars.VERCEL_AUTHOR_EMAIL != ''
        env:
          AUTHOR_NAME: ${{ vars.VERCEL_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.VERCEL_AUTHOR_EMAIL }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git commit --amend --no-edit --author="$AUTHOR_NAME <$AUTHOR_EMAIL>"

      - uses: actions/setup-node@v7
        if: steps.head.outputs.current == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        if: steps.head.outputs.current == 'true'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # GitHub holds the settings (setup and Admin > Deployment write them there); every release
      # copies the ones the two projects read at run time to Vercel, so the deployments below start
      # with them. A release skipped or replaced in the queue loses nothing: the next one copies
      # them again. Only values GitHub has; the rest stay as they are in Vercel.
      # The GitHub App's ID and key are how production reads runs and changes these values. (GH_,
      # not GITHUB_: GitHub refuses secret names with that prefix.)
      - name: Carry settings to Vercel
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          SHARED_SECRET: ${{ secrets.AGENT_SHARED_SECRET }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY_B64: ${{ secrets.GH_APP_PRIVATE_KEY_B64 }}
        run: |
          set_env() { # project id, name, value
            [[ -n "$3" ]] || return 0
            printf '%s' "$3" | VERCEL_PROJECT_ID="$1" vercel env add "$2" production --force --yes >/dev/null
            echo "  $2"
          }
          set_env "$WEB_PROJECT_ID" AGENT_SHARED_SECRET "$SHARED_SECRET"
          set_env "$AGENT_PROJECT_ID" AGENT_SHARED_SECRET "$SHARED_SECRET"
          set_env "$WEB_PROJECT_ID" GH_APP_ID "$GH_APP_ID"
          set_env "$WEB_PROJECT_ID" GH_APP_PRIVATE_KEY_B64 "$GH_APP_PRIVATE_KEY_B64"
          set_env "$AGENT_PROJECT_ID" AGENT_MODEL "$AGENT_MODEL"
          case "$AGENT_MODEL" in
            anthropic:*) key_name=ANTHROPIC_API_KEY ;;
            openai:*|openai-chat:*|openai-responses:*) key_name=OPENAI_API_KEY ;;
            openrouter:*) key_name=OPENROUTER_API_KEY ;;
            deepseek:*) key_name=DEEPSEEK_API_KEY ;;
            *) key_name="" ;;
          esac
          [[ -z "$key_name" ]] || set_env "$AGENT_PROJECT_ID" "$key_name" "$PROVIDER_API_KEY"

      # The agent is built by Vercel from source, not prebuilt here: its compiled Python packages
      # have to match the machine they run on (docs/adr/0003-deploy-topology.md).
      # --skip-domain: a production build that does not get the production domain yet.
      - name: Deploy agent (not yet live)
        id: agent
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AGENT_PROJECT_ID }}
        run: |
          url="$(vercel deploy --cwd agent --prod --skip-domain --yes)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Agent deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      # That it built does not show that it starts. /health shows the app imports and answers.
      # A POST without the secret must be 401: the endpoint is up AND closed. A 503 here means
      # AGENT_SHARED_SECRET is not set in the agent's Vercel environment.
      # From the project's folder, not with --cwd: `vercel curl` hands every option it does not
      # use to curl, and curl rejects --cwd. That stopped the first real release.
      - name: Smoke agent
        if: steps.head.outputs.current == 'true'
        working-directory: agent
        shell: bash
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AGENT_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.agent.outputs.url }}
        run: |
          vercel curl /health --deployment "$DEPLOYMENT_URL" -- \
            --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors >/dev/null

          code=""
          for attempt in 1 2 3; do
            code="$(vercel curl /runs/00000000-0000-0000-0000-000000000000/advance \
              --deployment "$DEPLOYMENT_URL" -- \
              --silent --output /dev/null --write-out '%{http_code}' --request POST || true)"
            if [[ "$code" == "401" ]]; then break; fi
            echo "attempt $attempt: got '$code'"
            sleep 3
          done
          if [[ "$code" != "401" ]]; then
            echo "::error::The agent answered '$code' to a request without the secret; expected 401. Not promoted."
            exit 1
          fi

      # The agent goes live before the web is built: the new web's smoke test checks the chain
      # through the production agent, and may call something only the new agent has. Migrations
      # and the agent must therefore work with the web that is still live (AGENTS.md, Limits).
      - name: Promote agent
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AGENT_PROJECT_ID }}
        run: vercel promote "${{ steps.agent.outputs.url }}" --cwd agent --yes

      - name: Build web
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          vercel pull --cwd web --yes --environment=production
          vercel build --cwd web --prod

      - name: Deploy web (not yet live)
        id: web
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          url="$(vercel deploy --cwd web --prebuilt --prod --skip-domain)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Web deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      # Signed out, the home page must redirect to /login. A 200 would mean the session check is
      # not running and every page is public.
      - name: Smoke web
        if: steps.head.outputs.current == 'true'
        working-directory: web
        shell: bash
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.web.outputs.url }}
        run: |
          for path in /api/health /login; do
            vercel curl "$path" --deployment "$DEPLOYMENT_URL" -- \
              --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors >/dev/null
          done

          code="$(vercel curl / --deployment "$DEPLOYMENT_URL" -- \
            --silent --output /dev/null --write-out '%{http_code}' || true)"
          if [[ "$code" != "307" ]]; then
            echo "::error::The home page answered '$code' to a signed-out request; expected a 307 to /login. Not promoted."
            exit 1
          fi

          # The whole chain: this web reaches the agent with its shared secret, the agent reaches
          # the database, Supabase Auth answers. A wrong AGENT_URL or a secret that differs
          # between the two projects is caught here instead of by the first person who clicks.
          deep="$(vercel curl /api/health/deep --deployment "$DEPLOYMENT_URL" -- \
            --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors || true)"
          echo "$deep"
          if ! grep -q '"agent":"ok"' <<<"$deep" || ! grep -q '"auth":"ok"' <<<"$deep"; then
            echo "::error::The deep health check failed (see the line above). Not promoted."
            exit 1
          fi

      - name: Promote web
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: vercel promote "${{ steps.web.outputs.url }}" --cwd web --yes
