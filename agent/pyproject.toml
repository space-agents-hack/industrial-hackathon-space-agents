[project]
name = "agent-service"
version = "0.1.0"
description = "Agent loop and tools. Writes runs, events and approval requests to Postgres."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    # Used directly (provider checks and model lists), not only through the libraries below.
    "genai-prices>=0.1.11",
    "httpx>=0.28",
    # The one dependency of Certivity's validate.py (certivity/README.md).
    "jsonschema>=4.23",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic-ai-slim[anthropic,openai,openrouter]>=2.55",
    "pydantic-settings>=2.15",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "supabase>=2.32",
    "uvicorn>=0.54",
]

[tool.uv]
# An application, not a library: nothing is built or published, `main.py` is the entrypoint.
package = false
# Not higher: Vercel builds this service with its own uv, 0.10.11 on 2026-10-14, and refuses to
# build if this says otherwise (the release failed when it said >=0.13). CI and laptops use newer.
required-version = ">=0.10"

[dependency-groups]
# One group on purpose. In a local `vercel build` (CLI 63.1.2) the builder left `dev` out of the
# function but installed a separate `evals` group, so the eval library was being deployed.
dev = [
    "pydantic-evals>=2.55",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Certivity's code, copied unchanged (certivity/README.md): not ours to reformat.
extend-exclude = ["certivity"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["agent_service", "tests", "evals", "main.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The Supabase client warns about its own internals on every call; nothing here can act on it.
filterwarnings = ["ignore::DeprecationWarning:supabase.*"]
markers = [
    "integration: needs a running local Supabase stack (SUPABASE_URL and SUPABASE_SECRET_KEY)",
]
